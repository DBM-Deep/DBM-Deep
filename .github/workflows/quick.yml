on: [push, pull_request]
name: Quick test

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Perl environment
        uses: shogo82148/actions-setup-perl@v1
      - name: Test and build
        run: |
          cpanm --installdeps .
          (echo y;echo y;echo)|perl Build.PL
          ./Build test TEST_VERBOSE=1
