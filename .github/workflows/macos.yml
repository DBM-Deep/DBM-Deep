# Auto-generated file, see workflow-templates/macos.yml
# To rebuild, see rebuild-workflows in https://github.com/DrHyde/meta-perlmodules

on:
  push:
    paths:
      - '.github/workflows/macos.yml'
      - '.github/workflows/run-macos'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
name: MacOS
jobs:
  build:
    if: github.actor != 'dependabot[bot]'
    strategy:
      fail-fast: false
      matrix:
        runs-on: ['macos-26', 'macos-14', 'macos-15']
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Perl environment
        uses: shogo82148/actions-setup-perl@v1
      - name: Test and build
        run: |
          cpanm DBD::SQLite Test::Pod Test::Pod::Coverage
          perl -Mparent -e0 || cpanm parent
          cpanm --installdeps .
          (echo y;echo y;echo)|perl Build.PL
          ./Build test TEST_VERBOSE=1
